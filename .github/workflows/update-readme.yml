on:
  push:
     paths:
       - '.github/assets/README_template.md'
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '^1.23'
      - name: Install required dependencies
        run: |
          go install github.com/anotherhadi/markdown-table-of-contents@v1.1.0
      - name: Run a script
        run: |
          chmod +x ./.github/scripts/create_readme.sh
          ./.github/scripts/create_readme.sh
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "Update README.md (auto)" && git push
          exit 0
